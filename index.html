<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BaatAI - AI Assistant</title>

<meta name="description"
      content="BaatAI is a fast AI assistant for chatting, studying, coding, writing and everyday questions.">

<link rel="icon" type="image/png" href="/baatai-logo-2.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#061014;
    color:#fff;
}

/* ================= BACKGROUND VIDEO ================= */

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(
            135deg,
            rgba(0,10,15,.88),
            rgba(0,30,35,.68),
            rgba(0,0,0,.88)
        );
    z-index:-2;
}

/* ================= APP ================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:280px;
    height:100%;
    background:rgba(3,18,23,.82);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-right:1px solid rgba(255,255,255,.10);
    display:flex;
    flex-direction:column;
    padding:18px;
    transition:.3s;
    z-index:20;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:25px;
}

.logo-area img{
    width:52px;
    height:52px;
    object-fit:contain;
    border-radius:14px;
}

.brand{
    display:flex;
    flex-direction:column;
}

.brand-name{
    font-size:23px;
    font-weight:800;
    letter-spacing:.5px;
}

.brand-sub{
    font-size:12px;
    color:#8ddce6;
    margin-top:2px;
}

.new-chat{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#00b8c8,#007b88);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,200,220,.20);
    margin-bottom:12px;
}

.new-chat:active{
    transform:scale(.98);
}

.clear-btn{
    width:100%;
    padding:11px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;
    background:rgba(255,255,255,.05);
    color:#ddd;
    cursor:pointer;
    margin-bottom:18px;
}

.section-title{
    font-size:11px;
    color:#7e9ba0;
    letter-spacing:1.5px;
    margin:5px 5px 10px;
}

.history{
    flex:1;
    overflow-y:auto;
    padding-right:3px;
}

.history::-webkit-scrollbar{
    width:4px;
}

.history::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.15);
    border-radius:10px;
}

.history-item{
    padding:12px;
    border-radius:11px;
    margin-bottom:6px;
    background:rgba(255,255,255,.035);
    color:#ddd;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-item:hover{
    background:rgba(255,255,255,.08);
}

.bottom-controls{
    border-top:1px solid rgba(255,255,255,.08);
    padding-top:14px;
    margin-top:12px;
}

.theme-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(3,15,19,.55);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{
    display:none;
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.07);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.header-logo{
    width:38px;
    height:38px;
    border-radius:10px;
    object-fit:contain;
}

.header-title{
    font-weight:bold;
    font-size:17px;
}

.header-sub{
    font-size:11px;
    color:#8baeb3;
    margin-top:2px;
}

/* ================= CHAT AREA ================= */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:25px 5%;
    scroll-behavior:smooth;
}

.chat-area::-webkit-scrollbar{
    width:6px;
}

.chat-area::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:10px;
}

/* ================= WELCOME ================= */

.welcome{
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px 10px;
}

.welcome-logo{
    width:105px;
    height:105px;
    object-fit:contain;
    border-radius:25px;
    margin-bottom:20px;
    filter:drop-shadow(0 10px 30px rgba(0,210,230,.25));
}

.welcome h1{
    font-size:34px;
    margin-bottom:8px;
}

.welcome p{
    color:#9fb7bb;
    max-width:600px;
    line-height:1.6;
}

.suggestions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.suggestion{
    padding:11px 15px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:20px;
    background:rgba(255,255,255,.05);
    color:#ddd;
    cursor:pointer;
    font-size:13px;
}

.suggestion:hover{
    background:rgba(0,190,210,.15);
}

/* ================= MESSAGES ================= */

.message-row{
    display:flex;
    margin-bottom:18px;
    width:100%;
}

.message-row.user{
    justify-content:flex-end;
}

.message-row.assistant{
    justify-content:flex-start;
}

.message{
    max-width:min(760px,85%);
    padding:13px 16px;
    border-radius:17px;
    line-height:1.55;
    font-size:15px;
    white-space:pre-wrap;
    word-break:break-word;
}

.user .message{
    background:linear-gradient(135deg,#008f9d,#006873);
    border-bottom-right-radius:5px;
}

.assistant .message{
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.08);
    border-bottom-left-radius:5px;
}

.message img{
    max-width:280px;
    width:100%;
    border-radius:12px;
    margin-top:8px;
}

/* ================= INPUT ================= */

.input-area{
    padding:12px 5% 18px;
    background:linear-gradient(
        to top,
        rgba(2,12,16,.95),
        rgba(2,12,16,.65),
        transparent
    );
}

.input-box{
    max-width:950px;
    margin:auto;
    min-height:58px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px;
    border-radius:18px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
}

#messageInput{
    flex:1;
    min-width:0;
    max-height:140px;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    padding:10px;
    font-size:15px;
    line-height:1.4;
}

#messageInput::placeholder{
    color:#789094;
}

.icon-btn{
    width:42px;
    height:42px;
    flex-shrink:0;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.icon-btn:hover{
    background:rgba(255,255,255,.12);
}

.send-btn{
    background:#00a9b8;
}

.send-btn:hover{
    background:#00c0d0;
}

#imageInput{
    display:none;
}

.image-preview{
    max-width:950px;
    margin:0 auto 8px;
    display:none;
    align-items:center;
    gap:10px;
    padding:8px;
    background:rgba(255,255,255,.06);
    border-radius:12px;
}

.image-preview img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:9px;
}

.remove-image{
    margin-left:auto;
    border:none;
    background:#a83232;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:9px;
    cursor:pointer;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    gap:5px;
    align-items:center;
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#91dce3;
    animation:blink 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{
    0%,80%,100%{
        opacity:.2;
    }
    40%{
        opacity:1;
    }
}

/* ================= LIGHT MODE ================= */

body.light{
    background:#eef8fa;
    color:#172326;
}

body.light .video-overlay{
    background:rgba(240,250,252,.78);
}

body.light .sidebar{
    background:rgba(245,252,253,.88);
    border-color:rgba(0,0,0,.08);
}

body.light .brand-name,
body.light .header-title{
    color:#132326;
}

body.light .clear-btn,
body.light .theme-btn,
body.light .history-item,
body.light .suggestion,
body.light .icon-btn{
    color:#243437;
    background:rgba(0,0,0,.05);
    border-color:rgba(0,0,0,.08);
}

body.light .header{
    background:rgba(245,252,253,.65);
    border-color:rgba(0,0,0,.08);
}

body.light .input-area{
    background:linear-gradient(
        to top,
        rgba(238,248,250,.95),
        rgba(238,248,250,.65),
        transparent
    );
}

body.light .input-box{
    background:rgba(255,255,255,.75);
    border-color:rgba(0,0,0,.10);
}

body.light #messageInput{
    color:#172326;
}

body.light #messageInput::placeholder{
    color:#789094;
}

body.light .assistant .message{
    color:#172326;
    background:rgba(255,255,255,.75);
    border-color:rgba(0,0,0,.08);
}

body.light .welcome p{
    color:#506568;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        width:280px;
        transition:.3s;
        box-shadow:10px 0 40px rgba(0,0,0,.4);
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .header{
        padding:0 12px;
    }

    .header-logo{
        width:34px;
        height:34px;
    }

    .chat-area{
        padding:18px 12px;
    }

    .input-area{
        padding:8px 10px 12px;
    }

    .message{
        max-width:90%;
        font-size:14px;
    }

    .welcome h1{
        font-size:27px;
    }

    .welcome-logo{
        width:85px;
        height:85px;
    }

    .suggestions{
        gap:7px;
    }

    .suggestion{
        font-size:12px;
        padding:9px 12px;
    }
}

/* ================= SIDEBAR BACKDROP ================= */

.sidebar-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:10;
}

.sidebar-backdrop.show{
    display:block;
}

@media(min-width:801px){
    .sidebar-backdrop{
        display:none!important;
    }
}
</style>
</head>

<body>
<video id="bgVideo" autoplay muted loop playsinline>
    <source src="/background.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

    <div class="logo-area">

        <img src="/baatai-logo.png" alt="BaatAI Logo">

        <div class="brand">
            <div class="brand-name">BaatAI</div>
            <div class="brand-sub">AI Study Assistant</div>
        </div>

    </div>

    <button class="new-chat" id="newChatBtn">
        ＋ New Chat
    </button>

    <button class="clear-btn" id="clearHistoryBtn">
        🗑 Clear History
    </button>

    <div class="section-title">
        CHATS
    </div>

    <div class="history" id="history"></div>

    <div class="bottom-controls">

        <button class="theme-btn" id="themeBtn">
            🌙 Dark Mode
        </button>

    </div>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <button class="mobile-menu" id="menuBtn">
                ☰
            </button>

            <img
                class="header-logo"
                src="/baatai-logo.png"
                alt="BaatAI Logo"
            >

            <div>
                <div class="header-title">
                    BaatAI
                </div>

                <div class="header-sub">
                    Fast AI Assistant
                </div>
            </div>

        </div>

    </header>


    <!-- CHAT -->

    <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">

            <img
                class="welcome-logo"
                src="/baatai-logo.png"
                alt="BaatAI Logo"
            >

            <h1>Welcome to BaatAI</h1>

            <p>
                Ask anything. Learn, create, code, write and explore
                with your AI assistant.
            </p>

            <div class="suggestions">

                <button class="suggestion">
                    💡 Give me an idea
                </button>

                <button class="suggestion">
                    📚 Explain a topic
                </button>

                <button class="suggestion">
                    💻 Help me with coding
                </button>

                <button class="suggestion">
                    ✍️ Write something
                </button>

            </div>

        </div>

    </section>


    <!-- ================= INPUT ================= -->

    <div class="input-area">

        <div class="image-preview" id="imagePreview">

            <img id="previewImage" src="" alt="Preview">

            <span>Image attached</span>

            <button
                class="remove-image"
                id="removeImage">
                ×
            </button>

        </div>

        <div class="input-box">

            <!-- IMAGE -->

            <button
                class="icon-btn"
                id="imageBtn"
                title="Upload Image">
                📎
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <!-- TEXT -->

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message BaatAI..."
            ></textarea>

            <!-- VOICE -->

            <button
                class="icon-btn"
                id="micBtn"
                title="Voice Input">
                🎤
            </button>

            <!-- SEND -->

            <button
                class="icon-btn send-btn"
                id="sendBtn"
                title="Send">
                ➤
            </button>

        </div>

    </div>

</main>

</div>


<script>

/* =====================================================
   BAATAI FRONTEND
   ===================================================== */

const API = "";

const STORAGE_KEY = "baatai-local-chats-v2";
const THEME_KEY = "baatai-theme";

let chats = [];
let currentChatId = null;
let selectedImage = null;


/* ================= ELEMENTS ================= */

const chatArea =
    document.getElementById("chatArea");

const welcome =
    document.getElementById("welcome");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageBtn =
    document.getElementById("imageBtn");

const imageInput =
    document.getElementById("imageInput");

const micBtn =
    document.getElementById("micBtn");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");

const historyBox =
    document.getElementById("history");

const sidebar =
    document.getElementById("sidebar");

const menuBtn =
    document.getElementById("menuBtn");

const sidebarBackdrop =
    document.getElementById("sidebarBackdrop");

const themeBtn =
    document.getElementById("themeBtn");

const newChatBtn =
    document.getElementById("newChatBtn");

const clearHistoryBtn =
    document.getElementById("clearHistoryBtn");


/* ================= LOAD DATA ================= */

function loadData(){

    try{
        chats =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            ) || [];
    }catch(e){
        chats = [];
    }

    const savedTheme =
        localStorage.getItem(THEME_KEY);

    if(savedTheme === "light"){
        document.body.classList.add("light");
        themeBtn.textContent = "☀️ Light Mode";
    }

    renderHistory();
}


/* ================= SAVE DATA ================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

}


/* ================= NEW CHAT ================= */

function createNewChat(){

    const id =
        Date.now().toString();

    const chat = {
        id:id,
        title:"New Chat",
        messages:[],
        createdAt:Date.now(),
        updatedAt:Date.now()
    };

    chats.unshift(chat);

    currentChatId = id;

    saveData();

    renderHistory();

    renderCurrentChat();

    closeSidebar();

    messageInput.focus();
}


/* ================= CURRENT CHAT ================= */

function getCurrentChat(){

    return chats.find(
        chat => chat.id === currentChatId
    );
}


/* ================= ENSURE CHAT ================= */

function ensureChat(){

    if(!currentChatId){

        createNewChat();

    }

    return getCurrentChat();
}


/* ================= HISTORY ================= */

function renderHistory(){

    historyBox.innerHTML = "";

    if(chats.length === 0){

        historyBox.innerHTML = `
            <div style="
                color:#71888c;
                font-size:12px;
                padding:10px;
            ">
                No chats yet
            </div>
        `;

        return;
    }

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className = "history-item";

        item.textContent =
            chat.title || "New Chat";

        item.title =
            chat.title || "New Chat";

        item.onclick = () => {

            currentChatId = chat.id;

            renderCurrentChat();

            closeSidebar();

        };

        historyBox.appendChild(item);

    });

}


/* ================= RENDER CHAT ================= */

function renderCurrentChat(){

    chatArea.innerHTML = "";

    const chat = getCurrentChat();

    if(!chat || chat.messages.length === 0){

        chatArea.appendChild(
            createWelcome()
        );

        return;
    }

    chat.messages.forEach(message => {

        addMessageToUI(
            message.role,
            message.content,
            message.image || null
        );

    });

    scrollBottom();
}


/* ================= WELCOME ================= */

function createWelcome(){

    const div =
        document.createElement("div");

    div.className = "welcome";

    div.innerHTML = `

<img src="/baatai-logo-2.png" alt="BaatAI Logo">
        <h1>Welcome to BaatAI</h1>

        <p>
            Ask anything. Learn, create, code, write
            and explore with your AI assistant.
        </p>

        <div class="suggestions">

            <button class="suggestion">
                💡 Give me an idea
            </button>

            <button class="suggestion">
                📚 Explain a topic
            </button>

            <button class="suggestion">
                💻 Help me with coding
            </button>

            <button class="suggestion">
                ✍️ Write something
            </button>

        </div>

    `;

    div.querySelectorAll(".suggestion")
        .forEach(btn => {

            btn.onclick = () => {

                messageInput.value =
                    btn.textContent
                    .replace(/^[^\w]+/,"")
                    .trim();

                sendMessage();

            };

        });

    return div;
}


/* ================= ADD MESSAGE ================= */

function addMessageToUI(
    role,
    content,
    image = null
){

    const row =
        document.createElement("div");

    row.className =
        "message-row " + role;

    const bubble =
        document.createElement("div");

    bubble.className =
        "message";

    if(content){
        bubble.textContent = content;
    }

    if(image){

        const img =
            document.createElement("img");

        img.src = image;

        img.alt = "Uploaded image";

        bubble.appendChild(img);

    }

    row.appendChild(bubble);

    chatArea.appendChild(row);

}


/* ================= TYPING ================= */

function showTyping(){

    const row =
        document.createElement("div");

    row.className =
        "message-row assistant";

    row.id = "typingMessage";

    row.innerHTML = `

        <div class="message">

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;

    chatArea.appendChild(row);

    scrollBottom();

}


function hideTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){
        typing.remove();
    }

}


/* ================= SCROLL ================= */

function scrollBottom(){

    setTimeout(() => {

        chatArea.scrollTop =
            chatArea.scrollHeight;

    },50);

}


/* ================= CONVERSATION ================= */

function getConversationForAPI(){

    const chat =
        getCurrentChat();

    if(!chat){
        return [];
    }

    return chat.messages
        .slice(-20)
        .map(item => ({
            role:
                item.role === "assistant"
                    ? "assistant"
                    : "user",

            content:
                String(item.content || "")
        }));

}


/* ================= SEND ================= */

async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text && !selectedImage){
        return;
    }

    const chat =
        ensureChat();

    if(!chat){
        return;
    }

    /*
      IMPORTANT:
      Conversation is collected BEFORE
      current user message is saved.
      This prevents duplicate messages.
    */

    const conversation =
        getConversationForAPI();

    const imageForMessage =
        selectedImage;

    const userMessage = {

        role:"user",

        content:text,

        image:imageForMessage || null

    };

    chat.messages.push(userMessage);

    if(
        chat.title === "New Chat" &&
        text
    ){

        chat.title =
            text.length > 35
                ? text.substring(0,35) + "..."
                : text;

    }

    chat.updatedAt = Date.now();

    saveData();

    welcome?.remove();

    addMessageToUI(
        "user",
        text,
        imageForMessage
    );

    messageInput.value = "";

    messageInput.style.height =
        "auto";

    selectedImage = null;

    imagePreview.style.display =
        "none";

    previewImage.src = "";

    renderHistory();

    scrollBottom();

    showTyping();

    sendBtn.disabled = true;


    try{

        const response =
            await fetch(
                API + "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            text,

                        conversation:
                            conversation,

                        image:
                            imageForMessage

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        const reply =
            data.reply ||
            "Sorry, I could not generate a response.";


        hideTyping();

        addMessageToUI(
            "assistant",
            reply
        );


        chat.messages.push({

            role:"assistant",

            content:reply,

            image:null

        });


        chat.updatedAt =
            Date.now();

        saveData();

        renderHistory();

        scrollBottom();


    }catch(error){

        hideTyping();

        const errorMessage =
            "⚠️ " +
            (
                error.message ||
                "Something went wrong. Please try again."
            );


        addMessageToUI(
            "assistant",
            errorMessage
        );


        chat.messages.push({

            role:"assistant",

            content:errorMessage,

            image:null

        });


        saveData();

        scrollBottom();

    }finally{

        sendBtn.disabled =
            false;

        messageInput.focus();

    }

}


/* ================= ENTER KEY ================= */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ================= AUTO TEXTAREA ================= */

messageInput.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                140
            ) + "px";

    }
);


/* ================= SEND BUTTON ================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ================= IMAGE UPLOAD ================= */

imageBtn.addEventListener(
    "click",
    () => imageInput.click()
);


imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        if(!file.type.startsWith("image/")){

            alert(
                "Please select an image."
            );

            return;

        }

        const reader =
            new FileReader();

        reader.onload = function(e){

            selectedImage =
                e.target.result;

            previewImage.src =
                selectedImage;

            imagePreview.style.display =
                "flex";

        };

        reader.readAsDataURL(file);

    }
);


/* ================= REMOVE IMAGE ================= */

removeImage.addEventListener(
    "click",
    () => {

        selectedImage = null;

        imageInput.value = "";

        previewImage.src = "";

        imagePreview.style.display =
            "none";

    }
);


/* ================= VOICE INPUT ================= */

let recognition = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang = "hi-IN";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = () => {

        micBtn.textContent = "🔴";

    };


    recognition.onend = () => {

        micBtn.textContent = "🎤";

    };


    recognition.onerror = () => {

        micBtn.textContent = "🎤";

    };


    recognition.onresult = event => {

        const transcript =
            event.results[0][0].transcript;

        messageInput.value +=
            (
                messageInput.value
                    ? " "
                    : ""
            ) + transcript;

        messageInput.dispatchEvent(
            new Event("input")
        );

    };


    micBtn.addEventListener(
        "click",
        () => {

            try{

                recognition.start();

            }catch(e){}

        }
    );

}else{

    micBtn.addEventListener(
        "click",
        () => {

            alert(
                "Voice input is not supported in this browser."
            );

        }
    );

}


/* ================= NEW CHAT ================= */

newChatBtn.addEventListener(
    "click",
    createNewChat
);


/* ================= CLEAR HISTORY ================= */

clearHistoryBtn.addEventListener(
    "click",
    () => {

        if(chats.length === 0){
            return;
        }

        const ok =
            confirm(
                "क्या आप पूरी chat history delete करना चाहते हैं?"
            );

        if(!ok){
            return;
        }

        chats = [];

        currentChatId = null;

        saveData();

        renderHistory();

        renderCurrentChat();

    }
);


/* ================= THEME ================= */

themeBtn.addEventListener(
    "click",
    () => {

        document.body.classList.toggle(
            "light"
        );

        const isLight =
            document.body.classList.contains(
                "light"
            );

        localStorage.setItem(
            THEME_KEY,
            isLight
                ? "light"
                : "dark"
        );

        themeBtn.textContent =
            isLight
                ? "☀️ Light Mode"
                : "🌙 Dark Mode";

    }
);


/* ================= MOBILE MENU ================= */

function openSidebar(){

    sidebar.classList.add("open");

    sidebarBackdrop.classList.add("show");

}


function closeSidebar(){

    sidebar.classList.remove("open");

    sidebarBackdrop.classList.remove("show");

}


menuBtn.addEventListener(
    "click",
    openSidebar
);


sidebarBackdrop.addEventListener(
    "click",
    closeSidebar
);


/* ================= START ================= */

loadData();

if(chats.length > 0){

    currentChatId =
        chats[0].id;

    renderCurrentChat();

}else{

    chatArea.innerHTML = "";

    chatArea.appendChild(
        createWelcome()
    );

}

</script>

</body>
</html>
